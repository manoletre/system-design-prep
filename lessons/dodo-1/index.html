.k-old{color:#9ece6a}.k-new{color:#7aa2f7}.k-cdc{color:#ff9e64}.k-app{color:#b392f0}.k-q{color:#e0af68}.k-lk{color:#5fc9b6}.k-w{color:#b392f0}.k-ap{color:#7aa2f7}.k-B{color:#e0af68}.k-stt{color:#7dcfff}.k-tts{color:#e08fd0}
.k-TP{color:#9ece6a}.k-FP{color:#ff9e64}.k-FN{color:#f7768e}.k-TN{color:#7aa2f7}.k-prec{color:#b392f0}.k-rec{color:#7dcfff}.k-F1{color:#e0af68}.k-thr{color:#e08fd0}.k-wS{color:#ff9e64}.k-wD{color:#f7768e}.k-wI{color:#7dcfff}.k-wN{color:#e6e6e6}

<script>
const LESSON = {"id": "dodo1", "title": "Dodo prep 1 · DB migration, voice agents, LiveKit", "h1": "Dodo prep 1: migrating a live database & how voice agents work", "sub": "For the dodo.ai first round. 5 chapters: what moves from Supabase to GCP, the zero-downtime playbook, catch-up math, the voice latency budget, and safe PMS writes. About 45 minutes at your own pace.", "drill": [{"id": "d1", "q": "“We're on Supabase and want to move to GCP. Walk me through how you'd plan it without dropping calls.” Start with the questions you'd ask me.", "model": "Ask first: why are we moving (compliance, cost, consolidation)? How big is the DB and what's the peak write rate? Which Supabase features do we use (Auth, Storage, Realtime, RLS, edge functions)? What downtime is acceptable? Then: inventory → snapshot → CDC (logical replication / DMS), checking that apply rate beats peak write rate → verify (counts, checksums, shadow reads, load test) → cutover behind a flag with a seconds-long write pause buffered in a queue → reverse replication for rollback. Migrate auth and storage as separate workstreams, and cut over at the lowest-traffic hour."}, {"id": "d2", "q": "“Design the system behind our AI phone receptionist.” Give the high-level components and the hardest problem.", "model": "Clarify: number of clinics, concurrent calls at peak, languages, which PMSs, SMS too? Components: telephony (SIP trunk) → media server / LiveKit → agent workers (STT → LLM with tools → TTS, streaming) → tools service talking to each PMS → DB (calls, tenants, bookings, transcripts) → queue for follow-ups → staff dashboard → evals and monitoring. Hardest parts: sub-second latency (streaming, filler during tool calls, barge-in, turn detection) and reliable PMS writes (timeouts, retries, idempotency, fallbacks). Also multi-tenancy and HIPAA (encryption, audit logs, BAAs with vendors)."}, {"id": "d3", "q": "“We're thinking about moving to LiveKit. What would you want to know, and how would you roll it out?”", "model": "Want to know: what we use today and its pain (latency, cost per minute, vendor lock-in, HIPAA and data control), call volume, and whether we'd self-host or use LiveKit Cloud. Tradeoff: more control over the pipeline and cost vs more to operate. Rollout: build the agent on LiveKit Agents with the same STT/LLM/TTS, run offline evals on recorded or simulated calls, then route a small share of one clinic's calls, compare latency, task success and transfer rate, and ramp up with a quick switch back to the old path."}], "key": ["old", "new", "cdc", "app", "q", "lk", "w", "ap", "B", "stt", "tts"], "sym": {"old": ["Supabase · old DB", "Where Dodo's data lives today."], "new": ["GCP · new DB", "Cloud SQL for Postgres or AlloyDB."], "cdc": ["Change stream (CDC)", "Reads the old DB's WAL and replays every insert/update/delete on the other DB."], "app": ["App / voice agent", "The code answering calls; it must never stop."], "q": ["Queue · timers", "Buffers writes or retries; timeouts and backoff."], "lk": ["LiveKit", "Open-source real-time media server + SIP bridge + Agents framework."], "w": ["w · write rate", "Changes per second the app makes on the old DB. Plan with the peak (≈ 3× average)."], "ap": ["a · apply rate", "Changes per second the new DB can replay from the change stream."], "B": ["B · backlog / lag", "Changes made on the old DB that the new DB hasn't applied yet."], "stt": ["STT · speech-to-text", "Turns the caller's audio into words, ideally streaming partial words."], "tts": ["TTS · text-to-speech", "Turns the agent's words into audio; streaming starts with the first sentence."]}, "macros": {"\\Wr": ["w", "w"], "\\Ap": ["ap", "a"], "\\Bk": ["B", "B"]}, "chapters": [{"title": "What Supabase is, and what GCP gives you", "short": "Supabase vs GCP", "video": "media/ch1-supabase-vs-gcp.mp4", "poster": "media/ch1-supabase-vs-gcp-poster.jpg", "steps": [{"key": "supa", "title": "Supabase is a bundle", "html": "<span class=\"sym k-old\">Supabase</span> is hosted <b>Postgres</b> (the open-source SQL database) plus extras: <b>Auth</b> (users, logins, tokens), <b>Storage</b> (files), <b>Realtime</b> (push DB changes to clients) and <b>row-level security</b> (RLS: rules inside Postgres that decide which rows each user can see). Startups pick it because one product covers all of that.", "start": 0.0, "end": 8.3}, {"key": "gcp", "title": "GCP gives you the database", "html": "On GCP the target is <span class=\"sym k-new\">Cloud SQL for Postgres</span> (managed Postgres: Google runs the servers, backups and patches) or <span class=\"sym k-new\">AlloyDB</span> (Google's faster, Postgres-compatible engine). The engine stays Postgres, so tables and SQL move easily. The extras don't come along: auth → Identity Platform or your own, files → Cloud Storage, realtime → Pub/Sub or your own service.", "start": 8.3, "end": 16.4}, {"key": "gotcha", "title": "The hidden coupling", "html": "RLS policies themselves are plain Postgres, but Supabase's policies usually call <code>auth.uid()</code>, which only works with Supabase Auth. Auth is often the hardest part of leaving Supabase, so plan it first. In the interview: <i>“the database is the easy part; everything around it is the work.”</i>", "start": 16.4, "end": 21.8}, {"key": "why", "title": "Why migrate at all?", "html": "Common reasons: <b>compliance</b> (HIPAA, the US health-privacy law: controls under one cloud agreement, private networking, audit logs), <b>one cloud</b> (keep data next to the services and credits you already use on GCP), <b>scale and control</b> (replicas, tuning, backups, extensions) and <b>cost</b> at scale. Ask Tim which one drives it, because that defines what “done” means.", "start": 21.8, "end": 30.3}], "check": {"id": "c1", "q": "In one or two sentences: why is “just copy the Postgres database to Cloud SQL” not the whole migration from Supabase?", "model": "Supabase is Postgres plus Auth, Storage, Realtime and RLS policies tied to Supabase Auth (<code>auth.uid()</code>). Cloud SQL / AlloyDB only gives you Postgres, so auth, files, realtime and the policies that depend on auth need their own plan."}, "hook": {"id": "h1", "q": "Supabase and GCP's Cloud SQL both run Postgres. If the database engine is the same, what could make leaving Supabase hard?", "model": "Supabase is more than Postgres: it also gives you Auth (logins), Storage (files), Realtime (live updates) and row-level security policies that usually call Supabase Auth's <code>auth.uid()</code>. Cloud SQL / AlloyDB give you only Postgres, so auth, files, realtime and auth-dependent policies need their own plan. Auth is usually the hardest part."}, "duration": 30.3}, {"title": "The zero-downtime migration playbook", "short": "Playbook", "video": "media/ch2-zero-downtime-playbook.mp4", "poster": "media/ch2-zero-downtime-playbook-poster.jpg", "steps": [{"key": "inventory", "title": "1 · Inventory", "html": "Before moving data, list everything the <span class=\"sym k-old\">old DB</span> does: tables and indexes, extensions, RLS policies, triggers and cron jobs, auth users, stored files, and every service that connects to it. Surprises found here are cheap; surprises found at cutover are outages.", "start": 0.0, "end": 7.7}, {"key": "snapshot", "title": "2 · Snapshot copy", "html": "A <b>snapshot</b> is a consistent copy of the whole database as of one moment (say 10:00). Copying the 1.2M rows into the <span class=\"sym k-new\">new DB</span> takes minutes to hours, and calls keep writing to the <span class=\"sym k-old\">old DB</span> the whole time, so the copy is already out of date when it finishes. Chapter 3 computes how far behind.", "start": 7.7, "end": 15.3}, {"key": "cdc", "title": "3 · Stream every change (CDC)", "html": "Postgres first writes every change to its <b>WAL</b> (write-ahead log: an append-only list of every insert, update and delete). <b>Change data capture (CDC)</b> reads that log and replays each change on the new DB. Postgres's built-in way to do it is <span class=\"sym k-cdc\">logical replication</span> (it sends row changes, not disk blocks, so the target can be a different server or cloud). GCP's <span class=\"sym k-cdc\">Database Migration Service</span> (DMS) runs it for you. <b>Replication lag</b> is how far the new DB trails the old one, here <span class=\"sym k-q\">about 2 s</span>.", "start": 15.3, "end": 23.8}, {"key": "verify", "title": "4 · Verify", "html": "Prove the copies match before trusting the new one: row counts per table, <b>checksums</b> (a fingerprint of each table's contents; equal fingerprints mean equal data), and <b>shadow reads</b> (send the same read query to both and compare the results). Also load-test the new DB at peak traffic.", "start": 23.8, "end": 29.1}, {"key": "cutover", "title": "5 · Cutover", "html": "Pause writes for a few seconds and hold them in a <span class=\"sym k-q\">queue</span>, wait until lag hits 0, flip a <b>feature flag</b> (a config switch that changes behavior without a deploy) so the <span class=\"sym k-app\">app</span> points at the <span class=\"sym k-new\">new DB</span>, then drain the queue into it. The <span class=\"sym k-app\">agent</span> keeps talking: “I've noted that, the clinic will confirm.” Downtime: seconds, and invisible to callers.", "start": 29.1, "end": 39.8}, {"key": "rollback", "title": "6 · Keep a way back", "html": "Turn on <span class=\"sym k-cdc\">reverse replication</span> (new → old) for a few days. If errors spike, flipping back is one flag change with no data lost. <b>Tradeoffs to name:</b> a big-bang copy in a maintenance window is simpler but means downtime, which Dodo can't afford; <b>dual writes</b> (app writes to both DBs) seem easy but drift when one write fails, so CDC is usually safer.", "start": 39.8, "end": 46.7}], "check": {"id": "c2", "q": "Why not just have the app write to both databases (dual writes) during the migration? And what does Dodo do with writes during the few seconds of cutover?", "model": "Dual writes drift: if one write succeeds and the other fails, or they land in different orders, the DBs silently disagree. CDC copies from one source of truth (the old DB's WAL). During cutover, writes go into a queue for a few seconds, then drain into the new DB once lag is 0 and the flag flips, while the agent keeps the caller in a graceful “noted, the clinic will confirm” mode."}, "hook": {"id": "hook", "q": "Dodo is on Supabase and wants to move to GCP while calls keep coming in 24/7. What could go wrong, and how would you avoid dropping a single call?", "model": "What can go wrong: writes made during the copy get lost, the two databases drift, Supabase-only features (Auth, Storage, RLS that calls <code>auth.uid()</code>) break, and a long maintenance window means unanswered calls. How to avoid it: inventory first, copy a snapshot, stream every change with CDC (logical replication / Database Migration Service), verify with counts, checksums and shadow reads, then cut over by pausing writes for seconds into a queue, waiting for lag 0 and flipping a flag. The agent keeps talking (“I've noted that, the clinic will confirm”), and reverse replication keeps a rollback path."}, "duration": 46.7}, {"title": "Catch-up and cutover math", "short": "Catch-up math", "video": "media/ch3-catch-up-math.mp4", "poster": "media/ch3-catch-up-math-poster.jpg", "steps": [{"key": "terms", "title": "The three quantities", "html": "<span class=\"sym k-w\">w</span> = <b>write rate</b>: changes per second the app makes on the old DB. <span class=\"sym k-ap\">a</span> = <b>apply rate</b>: changes per second the new DB can replay from the WAL. <span class=\"sym k-B\">B</span> = <b>backlog</b>: changes made on the old DB but not yet on the new one (lag measured in changes instead of seconds). <b>Why the formulas work:</b> every second, <span class=\"sym k-w\">w</span> new changes join the backlog and <span class=\"sym k-ap\">a</span> leave it, so the backlog changes by \\(\\Wr - \\Ap\\) per second. During the snapshot nothing is applied yet, so the backlog grows at the full <span class=\"sym k-w\">w</span>.", "start": 0.0, "end": 11.4}, {"key": "ex1", "title": "Worked example 1", "html": "Illustrative numbers: <span class=\"sym k-w\">w = 50/s</span>, snapshot 2 h, <span class=\"sym k-ap\">a = 250/s</span>.<ol><li>Snapshot time: \\(T = 2 \\times 3600 = 7200\\) s.</li><li>Backlog when the snapshot ends: \\(\\Bk = \\Wr \\times T = 50 \\times 7200 = 360{,}000\\) changes.</li><li>Net shrink per second: \\(\\Ap - \\Wr = 250 - 50 = 200\\) changes/s.</li><li>Catch-up time: \\(\\Bk \\div (\\Ap - \\Wr) = 360{,}000 \\div 200 = 1800\\) s = 30 min.</li></ol>On the chart, the rising slope is <span class=\"sym k-w\">w</span> and the falling slope is \\(\\Ap - \\Wr\\). The time is the height of the peak divided by the falling slope.<p class=\"hint\">Example numbers are made up for practice. Dodo's real numbers aren't public.</p>", "start": 11.4, "end": 23.1}, {"key": "ex2", "title": "Worked example 2 (edge case: a ≤ w)", "html": "Same backlog of 360,000, but the new DB is slow.<ul><li><span class=\"sym k-ap\">a = 50/s</span>: net \\(= 50 - 50 = 0\\)/s, so \\(360{,}000 \\div 0\\) has no answer. The backlog never shrinks.</li><li><span class=\"sym k-ap\">a = 40/s</span>: net \\(= 40 - 50 = -10\\)/s. The backlog <i>grows</i> by \\(10 \\times 3600 = 36{,}000\\) changes per hour.</li></ul><b>Use peak <span class=\"sym k-w\">w</span>, not average.</b> Peak traffic is about 3× the average (the multiplier you skipped in the URL shortener estimate): \\(3 \\times 50 = 150\\)/s, so you need <span class=\"sym k-ap\">a</span> above 150/s or catch-up stalls every busy afternoon. Fixes: parallel apply workers, a bigger target instance, building indexes after the bulk copy, or copying during off-peak hours.", "start": 23.1, "end": 33.4}, {"key": "cutover", "title": "Cutover math", "html": "Once caught up, the lag is small, e.g. 2 s, with <span class=\"sym k-w\">w = 50/s</span> and <span class=\"sym k-ap\">a = 250/s</span>.<ol><li>Changes in flight: \\(\\Wr \\times \\text{lag} = 50 \\times 2 = 100\\).</li><li>Pause writes into a queue for 5 s: \\(5 \\times 50 = 250\\) queued writes.</li><li>Drain the 100 in flight: \\(100 \\div 250 = 0.4\\) s, so lag = 0.</li><li>Flip the flag, then replay the queue on GCP: \\(250 \\div 250 = 1\\) s.</li></ol>That's why cutover costs seconds: the backlog is tiny by then. Callers hear the agent's “noted, the clinic will confirm” line and never notice.", "start": 33.4, "end": 44.5}, {"key": "faded", "title": "Your turn (faded example)", "html": "<span class=\"sym k-w\">w = 30/s</span>, snapshot 4 h, <span class=\"sym k-ap\">a = 150/s</span>. Steps 1–3 are done: \\(T = 14{,}400\\) s, \\(\\Bk = 30 \\times 14{,}400 = 432{,}000\\), net \\(= 150 - 30 = 120\\)/s. <b>Do step 4 on paper:</b> catch-up time = ?<details><summary>Check your last step</summary>\\(432{,}000 \\div 120 = 3600\\) s = <b>1 hour</b>.</details>", "start": 44.5, "end": 54.0}], "check": {"id": "p3", "q": "Pen and paper. Average write rate is 40 changes/s and peak is 3× that. The snapshot runs for 3 hours at the average rate. The new DB applies 100 changes/s. (a) What's the backlog when the snapshot ends? (b) How long does catch-up take at the average rate? (c) What happens if peak traffic hits during catch-up, and what would you change?", "model": "(a) T = 3 × 3,600 = 10,800 s; B = 40 × 10,800 = 432,000 changes. (b) Net = 100 − 40 = 60/s; 432,000 ÷ 60 = 7,200 s = 2 h. (c) Peak w = 3 × 40 = 120/s > a = 100/s, so net = −20/s and the backlog grows by 72,000 per hour of peak. Fix: raise a above 120/s (parallel apply, bigger instance, defer index builds) or run the snapshot and catch-up off-peak, e.g. overnight."}, "hook": {"id": "h3", "q": "The snapshot copy takes 2 hours, and calls keep writing 50 changes per second the whole time. When the copy finishes, how far behind is the new database? What decides whether it ever catches up?", "model": "Backlog = write rate × snapshot time = 50/s × 7,200 s = 360,000 changes. It catches up only if the new DB applies changes faster than calls create them (a > w). Then catch-up time = backlog ÷ (a − w); for a = 250/s that's 360,000 ÷ 200 = 1,800 s = 30 min. If a ≤ w it never catches up."}, "duration": 54.0}, {"title": "How a voice agent works: the latency budget and LiveKit", "short": "Voice + LiveKit", "video": "media/ch4-voice-latency-livekit.mp4", "poster": "media/ch4-voice-latency-livekit-poster.jpg", "steps": [{"key": "path", "title": "One turn of a call", "html": "A call arrives over the <b>PSTN</b> (the ordinary phone network) through a telephony provider such as Twilio, using <b>SIP</b> (the protocol that sets up and carries internet phone calls). A <b>media server</b> carries the audio streams; browsers and apps talk to it with <b>WebRTC</b> (the standard for real-time audio and video). Then <span class=\"sym k-stt\">STT</span> (speech-to-text) → <span class=\"sym k-app\">LLM agent</span> (which can call tools like “find a slot” in the PMS) → <span class=\"sym k-tts\">TTS</span> (text-to-speech) → back to the caller. <i>Dodo's current stack isn't public; a common setup is Twilio plus a hosted voice platform (Vapi, Retell) or a framework like Pipecat. Ask.</i>", "start": 0.0, "end": 12.933}, {"key": "seq", "title": "Worked example 1: no streaming", "html": "People notice a pause longer than about 1 s. Without streaming, each stage waits for the previous one to finish completely:<ol><li>Network in: 100 ms</li><li><span class=\"sym k-stt\">STT</span> final transcript after the caller stops: 300 ms</li><li>LLM writes the whole answer: 1,400 ms</li><li><span class=\"sym k-tts\">TTS</span> renders the whole answer: 600 ms</li><li>Network out: 100 ms</li></ol>Silence \\(= 100 + 300 + 1400 + 600 + 100 = 2500\\) ms = 2.5 s. Too slow.<p class=\"hint\">Example numbers are made up for practice. Dodo's real numbers aren't public.</p>", "start": 12.933, "end": 21.233}, {"key": "stream", "title": "Worked example 2: streaming", "html": "With <b>streaming</b>, each stage starts on the previous stage's first output. So only the time to the <i>first piece</i> counts: the LLM's <b>time to first token</b> plus the first sentence (350 ms), and <span class=\"sym k-tts\">TTS</span>'s first audio chunk (150 ms). <span class=\"sym k-stt\">STT</span> sends partial words as it hears them, so it finishes 200 ms after the caller stops.<br>Silence \\(= 100 + 200 + 350 + 150 + 100 = 900\\) ms. Same models, under 1 s. The rest of the answer is generated while the first sentence plays.", "start": 21.233, "end": 28.133}, {"key": "tool", "title": "Worked example 3 (edge case: a tool call)", "html": "Booking needs a PMS lookup that takes 1,200 ms.<ol><li>The LLM decides to call the tool at \\(100 + 200 + 300 = 600\\) ms.</li><li>Answer audio reaches the caller at \\(600 + 1200 + 350 + 150 + 100 = 2400\\) ms: 2.4 s of silence.</li><li>Fix: play a pre-recorded filler (“Let me check that for you”, 1.5 s) as soon as the tool call starts. It reaches the caller at \\(600 + 100 = 700\\) ms and ends at \\(700 + 1500 = 2200\\) ms.</li><li>Silence left: 700 ms before the filler and \\(2400 - 2200 = 200\\) ms after it.</li></ol>Other levers: cache clinic availability so the lookup is fast, or fetch it while the caller is still talking.", "start": 28.133, "end": 40.733}, {"key": "faded", "title": "Your turn (faded example)", "html": "Streaming with different vendors: network 80 ms each way, STT 250 ms, LLM first sentence 400 ms, TTS first audio 200 ms. Step 1 is done: \\(80 + 250 + 400 = 730\\) ms. <b>Finish the sum.</b> Is it under 1 s?<details><summary>Check your last step</summary>\\(730 + 200 + 80 = 1010\\) ms, just <b>over</b> 1 s. Trim one stage: a faster TTS (200 → 120 ms) or a smaller LLM gets you under.</details>", "start": 40.733, "end": 49.733}, {"key": "bargein", "title": "Barge-in and turn detection", "html": "Real callers interrupt. <b>Barge-in</b>: voice-activity detection (VAD, a small model that hears whether someone is speaking) notices the caller and stops TTS instantly. <b>Turn detection</b> decides when the caller has actually finished (a pause vs. the end of a thought). Too eager and the agent cuts people off; too slow and every turn gets longer.", "start": 49.733, "end": 56.433}, {"key": "livekit", "title": "What LiveKit is", "html": "<span class=\"sym k-lk\">LiveKit</span> is an open-source (Apache 2.0) real-time platform: a WebRTC media server, <span class=\"sym k-lk\">LiveKit SIP</span> to bridge phone calls in through a SIP trunk (Twilio, Telnyx, …), and the <span class=\"sym k-lk\">Agents framework</span> (Python/Node) that runs STT → LLM → TTS with plugins for most providers, plus built-in turn detection and interruption handling. Run it yourself or on managed <span class=\"sym k-lk\">LiveKit Cloud</span>.", "start": 56.433, "end": 63.033}, {"key": "tradeoff", "title": "Why a team moves to it", "html": "<b>Pros:</b> you own the pipeline, so you can tune latency, swap STT/LLM/TTS vendors, pay less per minute at high volume than an all-in-one platform, and self-host for tighter control over patient data. <b>Costs:</b> more to operate (scaling, SIP, monitoring), rebuilding what the old platform did, and moving live call traffic safely. It's the same shape as the DB migration: more control, more responsibility. Roll it out gradually, e.g. route 5% of one clinic's calls first.", "start": 63.033, "end": 71.633}], "check": {"id": "p4", "q": "Pen and paper. A streaming pipeline: network 80 ms each way, STT 250 ms, the LLM needs 300 ms to decide on a tool call and 450 ms for its first sentence, TTS first audio 180 ms. (a) Silence for a normal turn with no tool call? (b) A PMS lookup takes 1.5 s, and a 1.2 s pre-recorded filler starts as soon as the tool call starts. When does the caller first hear audio, when does the answer arrive, and how long is the silence after the filler ends?", "model": "(a) 80 + 250 + 450 + 180 + 80 = 1,040 ms, slightly over 1 s. (b) The tool call starts at 80 + 250 + 300 = 630 ms. The filler reaches the caller at 630 + 80 = 710 ms and ends at 710 + 1,200 = 1,910 ms. The answer arrives at 630 + 1,500 + 450 + 180 + 80 = 2,840 ms. Silence after the filler = 2,840 − 1,910 = 930 ms, which is too long: use a longer or second filler, cache availability, or start the lookup earlier."}, "hook": {"id": "c3", "q": "Name the stages of one voice-agent turn, and two techniques that keep it under about 1 second.", "model": "Telephony (PSTN/SIP) → media server → STT → LLM agent (+ tools) → TTS → back to the caller. Keep it fast by streaming every stage (partial transcripts, token streaming, TTS on the first sentence), putting servers near the telephony region, using faster models, speaking a filler line before slow tool calls, and good turn detection and barge-in."}, "duration": 71.633}, {"title": "Touching the clinic's PMS safely", "short": "PMS safety", "video": "media/ch5-pms-safely.mp4", "poster": "media/ch5-pms-safely-poster.jpg", "steps": [{"key": "retry", "title": "Timeouts and retries", "html": "The <b>practice management system (PMS)</b> is the clinic's own scheduling and records software: slow, sometimes down, rate-limited. Every call gets a <span class=\"sym k-q\">timeout</span> (for example 3 s), then retries with <b>exponential backoff</b> (wait 0.5 s, 1 s, 2 s: doubling each time) plus random <b>jitter</b> (a small random extra wait) so hundreds of agents don't retry in lockstep. After that, stop and fall back.", "start": 0.0, "end": 8.5}, {"key": "idem", "title": "Idempotency keys", "html": "The dangerous case: the booking succeeded but the reply got lost, so a retry books Bella twice. Fix: an <b>idempotency key</b>, a unique ID for one intended action (e.g. <span class=\"sym k-q\">call-8812-book-1</span>), sent with every attempt and stored with the result. A repeat with the same key returns the existing booking instead of creating a new one. If the PMS doesn't support keys, keep your own bookings table and check it before writing.", "start": 8.5, "end": 17.1}, {"key": "count", "title": "How to count appointments", "html": "Each attempt ends one of three ways: <b>✗</b> failed before writing (nothing created), <b>⚠</b> wrote but the reply was lost (the agent thinks it failed and retries), <b>✓</b> wrote and the reply arrived (the agent stops).<ul><li><b>No key:</b> appointments = number of attempts that wrote (⚠ or ✓).</li><li><b>With key:</b> appointments = 1 if any attempt wrote, because later attempts get the first booking back.</li></ul>", "start": 17.1, "end": 27.8}, {"key": "ex1", "title": "Worked example 1: ⚠ then ✓", "html": "<ol><li>Try 1 ⚠: wrote, reply lost → 1 appointment so far.</li><li>Try 2 ✓: wrote again → <b>no key: 1 + 1 = 2 appointments</b>, double-booked.</li><li>With the key, try 2 sends <code>call-8812-book-1</code> again, so the PMS returns try 1's booking → <b>1 appointment</b>.</li></ol>", "start": 27.8, "end": 38.2}, {"key": "ex2", "title": "Worked example 2 (edge cases)", "html": "<b>⚠ ⚠ ⚠</b> (out of tries): no key → \\(1 + 1 + 1 = 3\\) appointments, <i>and</i> the agent tells the caller it failed. With key → 1 appointment; before saying “failed”, look up the key and you'll find it's booked.<br><b>✗ ✗ ✓</b>: \\(0 + 0 + 1 = 1\\) either way. Retries are harmless when nothing was written; the danger is only the lost reply.<br><b>At scale:</b> 5,000 bookings a day with 1% of replies lost after writing → \\(5000 \\times 0.01 = 50\\) double bookings a day without keys, 0 with them.", "start": 38.2, "end": 48.7}, {"key": "faded", "title": "Your turn (faded example)", "html": "Sequence <b>✗ ⚠ ✓</b>. No key is done: \\(0 + 1 + 1 = 2\\) appointments. <b>How many with the key?</b><details><summary>Check your last step</summary><b>1.</b> Try 1 wrote nothing; try 2 wrote; try 3 reuses the key and gets try 2's booking back.</details>", "start": 48.7, "end": 57.7}, {"key": "tenant", "title": "Multi-tenant isolation", "html": "A <b>tenant</b> is one customer whose data must stay separate, here one clinic. Hundreds of clinics share one system, so every row, query, cache key, log line and LLM prompt carries a <code>clinic_id</code>. Each clinic has its own PMS credentials, hours and rules. Enforce isolation in the database (RLS or per-tenant schemas), not just in app code. For HIPAA, add encryption, audit logs and least-privilege access.", "start": 57.7, "end": 63.8}, {"key": "fallback", "title": "Graceful fallbacks", "html": "If the PMS is down, the <span class=\"sym k-app\">agent</span> still answers: “I've noted your request; the clinic will text to confirm,” and the task goes into a <span class=\"sym k-q\">queue</span> for staff or a later retry. If the LLM provider is down, switch to a backup model or transfer the call to the front desk. The rule: the call is always answered and the work is never lost.", "start": 63.8, "end": 71.1}], "check": {"id": "p5", "q": "Pen and paper. The agent tries a booking at most 3 times. Count the appointments with and without an idempotency key for (a) ⚠ ✗ ✓ and (b) ⚠ ⚠ ✓. (c) A clinic group makes 8,000 bookings a day, and 2% of first attempts write but lose the reply; the retry always succeeds. How many double bookings a day without keys, and with them?", "model": "(a) No key: 1 + 0 + 1 = 2; with key: 1. (b) No key: 1 + 1 + 1 = 3; with key: 1. (c) 8,000 × 0.02 = 160 double bookings a day without keys (about 4,800 a month); 0 with keys."}, "hook": {"id": "c4", "q": "The agent booked an appointment, but the PMS reply timed out and the agent retried. How do you make sure there's only one appointment?", "model": "Use an idempotency key per booking attempt (e.g. call ID + action). Store key → result; on a retry with the same key, return the stored booking instead of writing again. If the PMS has no idempotency support, keep your own bookings record and check the PMS for an existing appointment (same patient and slot) before writing. Combine with timeouts, backoff with jitter, and a fallback to a staff queue."}, "duration": 71.1}], "summary": ["Supabase = Postgres + Auth + Storage + Realtime + RLS. GCP (Cloud SQL / AlloyDB) gives you Postgres; the extras, especially auth, are the real migration work.", "Zero-downtime playbook: inventory → snapshot → CDC (read the WAL, replay via logical replication) → verify → cutover behind a flag → reverse replication for rollback.", "Catch-up math: backlog B = w × T; catch-up = B ÷ (a − w). If a ≤ w it never catches up. Plan with peak w (≈ 3× average).", "Voice latency: sum the stages. Without streaming ≈ 2.5 s; with streaming only first pieces count ≈ 0.9 s. A tool call adds its full time, so mask it with filler speech.", "LiveKit = open-source WebRTC media server + SIP bridge + Agents framework. More control and lower cost at scale, more to operate.", "PMS writes: no key → one appointment per attempt that wrote; with an idempotency key → one. Add timeouts, backoff with jitter, clinic_id everywhere, and the call is always answered."]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const K=(q,f)=>`lap:${LESSON.id}:${q}:${f}`;
const store={get:(q,f)=>localStorage.getItem(K(q,f))||"",set:(q,f,v)=>localStorage.setItem(K(q,f),v)};
const fmt=t=>t<60?Math.round(t)+"s":Math.floor(t/60)+"m"+String(Math.round(t%60)).padStart(2,"0");
const CH=LESSON.chapters, DRILL=LESSON.drill||[], NC=CH.length;
const PH=["Question","Learn","Compare","Practice"];
// ---------- question registry (ids are the localStorage keys; keep them stable across edits) ----------
const REV=[];CH.forEach((c,i)=>{REV.push([c.hook,`Chapter ${i+1} prediction`]);REV.push([c.check,`Chapter ${i+1} practice`]);});DRILL.forEach((q,i)=>REV.push([q,`Drill ${i+1}`]));
const QA={};REV.forEach(([q])=>QA[q.id]=q);
// ---------- screens: intro, chapters, drill?, revisit ----------
const SCR=[{type:"intro"},...CH.map((c,ci)=>({type:"ch",ci})),...(DRILL.length?[{type:"drill"}]:[]),{type:"revisit"}];
const cmpHTML=qid=>`<div data-cmp="${qid}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${QA[qid].model}</p></div></div>
  <div class="rate">How did you do? <button class="g" data-r="got">Got it</button><button class="p" data-r="partly">Partly</button><button class="m" data-r="missed">Missed</button></div>
  <div class="notewrap"><label>What was unclear? (optional)</label><textarea class="note" data-note="${qid}" placeholder="Anything that still feels fuzzy…"></textarea></div></div>`;
const ansHTML=(qid,ph)=>`<textarea data-ans="${qid}" placeholder="${ph}"></textarea>`;
function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>
  <p><b>How each chapter works</b></p><ol><li><b>Question:</b> write your prediction. The video stays hidden until you press Start.</li><li><b>Learn:</b> click a step (or press <kbd>→</kbd>) to play just that part. It pauses at the end. <kbd>←</kbd> goes back, <kbd>R</kbd> replays.</li><li><b>Compare:</b> your answer next to the model answer. Rate yourself and note what was unclear.</li><li><b>Practice:</b> a pen-and-paper problem. Answer it, then reveal.</li></ol>
  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>
    <p class="qtext"><span class="lbl">Predict first:</span> ${c.hook.q}</p>${ansHTML(c.hook.id,"Your prediction. A rough guess is fine; you'll compare it after the video.")}
    <div class="row"><button class="primary" data-start="${ci}">Start chapter ▶</button><span class="saved" data-saved="${c.hook.id}"></span><span class="hint">The video stays hidden until you start.</span></div></div></div>
  <div class="phase" data-ph="1"><div class="lhead"><p class="eyebrow" style="margin:0">Chapter ${n} of ${NC}</p><h2>${c.title}</h2></div>
    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>
    <ol class="steps">${c.steps.map((s,si)=>`<li data-ci="${ci}" data-si="${si}"><div class="sh"><span class="num">${si+1}</span><span class="t">${s.title}</span><span class="d">${fmt(s.end-s.start)}</span></div><div class="sb">${s.html}</div></li>`).join("")}</ol></div></div>
  <div class="phase" data-ph="2"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[2]}</p><h2>Your prediction vs the answer</h2><p class="qtext">${c.hook.q}</p>${cmpHTML(c.hook.id)}</div></div>
  <div class="phase" data-ph="3"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[3]}</p><h2>✏️ Pen &amp; paper practice</h2><p class="qtext">${c.check.q}</p>
    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>
    <div data-revealbox="${c.check.id}" hidden>${cmpHTML(c.check.id)}</div></div></div>`;}
function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>
  ${REV.map(([q,lab])=>`<div class="qblock"><p class="qtext"><span class="tag">${lab} ·</span> ${q.q}</p><div data-cmpro="${q.id}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${q.model}</p></div></div><div class="rate">Rating: <b class="rv">–</b></div><div class="revnote"></div></div></div>`).join("")}
  <div class="row" style="margin:0 0 22px"><button id="copynotes">Copy my ratings &amp; unclear notes</button><span class="hint" id="copyst">Paste them to your coach in chat; anything marked Partly, Missed or unclear gets re-quizzed next lesson.</span></div>
  <div class="summary"><h3>Summary</h3><ol>${LESSON.summary.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;}
$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");
// ---------- answers ----------
function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);
  $$(`[data-${f==="answer"?"ans":"note"}="${q}"]`).forEach(x=>{if(x!==t)x.value=t.value;});if(f==="answer")$$(`[data-saved="${q}"]`).forEach(s=>s.textContent="saved ✓");refresh();});
function showReveal(q){$$(`[data-revealbox="${q}"]`).forEach(b=>b.hidden=false);$$(`[data-reveal="${q}"]`).forEach(b=>b.textContent="Revealed ✓");refresh();}
$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));
Object.keys(QA).forEach(q=>{if(store.get(q,"revealed"))showReveal(q);});refresh();
// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
document.addEventListener("click",e=>{const t=e.target;
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
document.addEventListener("click",e=>{if(e.target.id!=="copynotes")return;const R={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.map(([q,lab])=>{const r=store.get(q.id,"rating"),n=store.get(q.id,"note").trim();return (r&&r!=="got")||n?`- ${lab} (${R[r]||"not rated"}): ${q.q.replace(/<[^>]+>/g,"")}${n?"\n  Unclear: "+n:""}`:null;}).filter(Boolean);
  const txt=`${LESSON.title}\n`+(lines.length?lines.join("\n"):"Everything rated Got it, no unclear notes.");
  const done=()=>$("#copyst").textContent="Copied ✓ Paste it to your coach.";
  (navigator.clipboard?navigator.clipboard.writeText(txt).then(done):Promise.reject()).catch(()=>{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();done();});});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
</body>
</html>
